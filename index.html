<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title> IPO AI 私教 V0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#101828;color:#fff;padding:15px 16px}.brand{font-size:19px;font-weight:800}.sub{font-size:12px;color:#cbd5e1;margin-top:4px}main{max-width:720px;margin:auto;padding:12px 12px 90px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px #1018280a}h1{font-size:21px;line-height:1.4;margin:9px 0}h2{font-size:17px;margin:0 0 9px}.muted{color:#667085;font-size:13px;line-height:1.65}.quote{background:#f8fafc;border-left:4px solid #2563eb;padding:13px;border-radius:10px;line-height:1.7}.en{font-size:18px;line-height:1.65}.cn{color:#667085;font-size:13px;line-height:1.65}button{border:0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:650;background:#2563eb;color:#fff}button.secondary{background:#eaf1ff;color:#1d4ed8}button.ghost{background:#f2f4f7;color:#344054}.full{width:100%;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.step{padding:11px;background:#f8fafc;border-radius:10px;margin:7px 0;font-size:13px}.progress{height:8px;background:#edf0f5;border-radius:9px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}textarea{width:100%;min-height:105px;border:1px solid #d0d5dd;border-radius:12px;padding:12px;font:inherit;font-size:15px}.hidden{display:none}.term{display:inline-block;background:#f0fdf4;color:#166534;border-radius:7px;padding:5px 8px;margin:3px;font-size:12px}.chat{background:#f8fafc;border-radius:12px;padding:8px}.msg{padding:9px;border-radius:10px;margin:6px 0;font-size:13px;line-height:1.6}.ai{background:#eaf1ff}.user{background:#dcfce7;margin-left:10%}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;padding:9px 12px}.bottomrow{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:11px;background:#fff;font-size:14px}
</style></head><body>
<header><div class="brand">🧬  IPO AI 私教 · V0.3</div><div class="sub">手机教学版｜先输入，再输出｜第一章：公司介绍 & Business Model</div></header>
<main>
<div class="card"><div class="muted" id="counter">第 1 / 10 课</div><div class="progress"><div class="bar" id="bar"></div></div><h1 id="title"></h1><div class="quote"><b>Sponsor：</b><br><span id="q"></span><div class="cn" id="qcn"></div></div></div>
<div class="card"><h2>① 为什么他会问？</h2><div class="muted" id="why"></div><h2 style="margin-top:16px">② 真正想了解什么？</h2><div class="muted" id="logic"></div></div>
<div class="card"><h2>③ 应该怎么答？</h2><div class="step">先记结构，不死背：<b>理解 → 听 → 跟读 → 复述</b></div><button class="secondary full" onclick="model()">👀 查看标准答案</button><div id="modelbox" class="hidden" style="margin-top:10px"></div></div>
<div class="card"><h2>④ 🎧 听 + 跟读</h2><div class="en" id="read"></div><div class="cn" id="readcn"></div><div class="grid"><button onclick="speak()">🔊 播放英文</button><button class="secondary" onclick="voice()">🎙️ 语音跟读</button></div><div id="status" class="muted"></div><button class="ghost full" onclick="terms()">显示核心词汇</button><div id="termsbox" class="hidden"></div></div>
<div class="card"><h2>⑤ 🧠 你试着说</h2><div class="muted">不会没关系。可以先看中文提示，再说英文。</div><textarea id="answer" placeholder="你可以直接输入，或点击“语音跟读”说英文。"></textarea><div class="grid"><button onclick="submitA()">提交回答</button><button class="secondary" onclick="hint()">给我提示</button></div><div id="feedback" class="muted" style="margin-top:9px"></div></div>
<div class="card"><h2>💬 AI 教练</h2><div class="grid"><button class="secondary" onclick="coach('explain')">再解释一遍</button><button class="secondary" onclick="coach('simple')">简单一点</button><button class="secondary" onclick="coach('phrase')">教我句型</button><button class="secondary" onclick="coach('repeat')">再来一次</button></div><div id="chat" class="chat" style="margin-top:9px"></div></div>
<div class="card"><h2>📖 IPO学习提醒</h2><div class="muted">这里的英文用于训练表达。正式 IPO 项目中的事实、财务数据、业务描述及披露口径必须以公司经核实资料和专业顾问意见为准。</div></div>
<select id="select" onchange="idx=Number(this.value);render()"></select>
</main>
<div class="bottom"><div class="bottomrow"><button class="ghost" onclick="prev()">← 上一课</button><button onclick="next()">完成本课，下一课 →</button></div></div>
<script>
const data=[
["如何向 Sponsor 介绍公司？","Could you briefly introduce the Company and its principal business activities?","中文：请简要介绍公司及其主营业务。","Sponsor 先确认公司做什么、怎么赚钱、业务边界是否清晰。","What you do → How you do it → What you sell → How you make money.","We are a biotechnology company focusing on protein design, engineering and production. We leverage AI-assisted protein design and structural biology technologies to develop and optimize protein products. We provide protein engineering services to our customers and also develop and commercialize our proprietary protein products.","We are a biotechnology company focusing on protein design, engineering and production.","我们是一家专注于蛋白质设计、改造和生产的生物科技公司。",["biotechnology company = 生物科技公司","focus on = 专注于","protein design = 蛋白质设计","protein engineering = 蛋白质工程","commercialize = 商业化"]],
["用一句话说清楚公司的商业模式","Could you walk us through the Company's business model?","中文：请介绍一下公司的商业模式。","Sponsor 想知道业务如何从技术变成收入，而不仅仅是知道技术。","业务基础 → 主要业务/收入 → 客户 → 商业化。","Our business model is built around our protein design and engineering capabilities. We provide protein engineering services to customers and generate revenue from the sale of our proprietary protein products.","Our business model is built around our protein design and engineering capabilities.","我们的商业模式建立在蛋白质设计和工程能力基础之上。",["business model = 商业模式","be built around = 建立在……基础上","generate revenue from = 从……产生收入","proprietary = 专有的"]],
["公司的主要收入来源是什么？","What are the Company's major revenue streams?","中文：公司的主要收入来源是什么？","Sponsor 和审计师都会重点关注收入来源、变化原因以及收入性质。","主要收入来源 → 每类收入 → 客户 → 收入如何形成。","Our major revenue streams mainly come from protein engineering services and the sale of protein products. The relative contribution of each stream may vary depending on customer demand, product commercialization and production capacity.","Our major revenue streams mainly come from protein engineering services and the sale of protein products.","我们的主要收入来源主要来自蛋白质工程服务和蛋白产品销售。",["revenue stream = 收入来源","relative contribution = 相对贡献","customer demand = 客户需求","production capacity = 产能"]],
["如何解释 AI 在公司的作用？","Could you explain how AI contributes to the Company's protein design process?","中文：请解释 AI 如何参与公司的蛋白质设计流程。","如果你强调 AI，Sponsor 会验证 AI 到底是核心技术、工具还是营销概念。","AI 做什么 → 用在哪个环节 → 效果 → 实验验证。","AI is used as an important tool in our protein design and optimization process. It helps us analyze protein structures, identify potential design candidates and improve the efficiency of our R&D process. The AI-generated designs are then subject to experimental validation.","AI is used as an important tool in our protein design and optimization process.","AI 是我们蛋白质设计和优化流程中的重要工具。",["protein design = 蛋白质设计","optimization = 优化","design candidate = 设计候选物","experimental validation = 实验验证"]],
["公司的技术优势是什么？","What are the Company's key technology advantages?","中文：公司的主要技术优势是什么？","Sponsor 不会满足于“我们技术很强”，而会追问具体优势、证据和可持续性。","技术平台 → 研发效率 → 产品/服务能力 → 数据/验证 → 壁垒。","Our technology advantages are reflected in our integrated protein design and engineering capabilities. By combining AI-assisted design with experimental validation and downstream production capabilities, we are able to improve the efficiency of protein optimization.","Our technology advantages are reflected in our integrated protein design and engineering capabilities.","我们的技术优势体现在一体化的蛋白质设计和工程能力上。",["integrated capabilities = 一体化能力","protein optimization = 蛋白质优化","experimental validation = 实验验证","reflect in = 体现在"]],
["客户为什么选择公司？","Why do customers choose the Company instead of competitors?","中文：为什么客户选择公司而不是竞争对手？","这是在验证竞争优势是否真实。Sponsor 希望听到客户选择公司的具体原因。","客户需求 → 公司解决方案 → 客户价值 → 证据。","Customers choose us mainly because of our ability to provide integrated protein design, engineering and development solutions. We aim to reduce development time and improve the efficiency of protein optimization.","Customers choose us mainly because of our ability to provide integrated protein design, engineering and development solutions.","客户选择我们，主要是因为我们能够提供一体化的蛋白质设计、工程和开发解决方案。",["integrated solution = 一体化解决方案","customer requirements = 客户需求","reduce development time = 缩短开发时间","protein optimization = 蛋白质优化"]],
["公司的服务和自主产品如何区分？","How do you distinguish between your services and your proprietary products?","中文：公司的服务业务和自主产品业务如何区分？","Sponsor 需要理解收入性质、业务模式和未来增长来源。","服务：根据客户需求解决问题并收费；产品：公司自主开发并销售。","Our services are primarily provided based on specific customer requirements, while our proprietary products are developed by the Company and sold to customers.","Our services are primarily provided based on specific customer requirements, while our proprietary products are developed by the Company and sold to customers.","我们的服务主要根据客户具体需求提供，而自主产品则由公司开发并销售。",["customer requirements = 客户需求","proprietary products = 自主产品","commercialization model = 商业化模式","revenue generation = 收入产生"]],
["如何解释公司的增长逻辑？","What are the key drivers of the Company's future growth?","中文：公司未来增长的主要驱动因素是什么？","Sponsor 会判断增长是否有合理依据。","现有业务增长 → 产品商业化 → 技术/产能/客户扩展。","We see three key drivers for future growth: expansion of our customer base, commercialization of selected protein products, and continued enhancement of our protein design and engineering capabilities.","We see three key drivers for future growth: expansion of our customer base, commercialization of selected protein products, and continued enhancement of our capabilities.","我们认为未来增长主要有三个驱动因素：客户基础扩大、部分蛋白产品商业化以及能力持续提升。",["key driver = 主要驱动因素","customer base = 客户基础","continued enhancement = 持续提升","selected products = 部分/重点产品"]],
["如何回答“增长是否可持续”？","Why do you believe the Company's growth is sustainable?","中文：为什么你认为公司的增长具有可持续性？","这是典型 IPO 深挖问题，会从客户、产品、技术、产能和行业需求验证。","先结论，再给三个依据。不要只说 market is huge / technology is strong。","We believe the Company's growth is sustainable for several reasons. First, we continue to expand our customer base. Second, we are commercializing selected proprietary protein products. Third, we continue to enhance our technology and production capabilities.","We believe the Company's growth is sustainable for several reasons.","我们认为公司的增长具有可持续性，主要基于几个原因。",["sustainable growth = 可持续增长","for several reasons = 基于几个原因","expand customer base = 扩大客户基础","production capabilities = 生产能力"]],
["Sponsor 如何继续追问你？","What evidence supports your assessment of the Company's growth prospects?","中文：有什么证据支持你对公司增长前景的判断？","IPO 沟通不能只讲观点。Sponsor 会要求数据、合同、客户、订单、产品进展或历史表现来支持判断。","观点 → 历史数据 + 客户/订单 + 产品进展 + 产能/研发进展。","Our assessment is supported by a combination of historical operating performance, customer development, product commercialization progress and continued investment in our technology and production capabilities.","Our assessment is supported by a combination of historical operating performance, customer development and product commercialization progress.","我们的判断有历史经营表现、客户拓展以及产品商业化进展等多方面因素支持。",["assessment = 判断/评估","supporting evidence = 支持性证据","operating performance = 经营表现","relevant documentation = 相关文件"]]
];
let idx=0,done=new Set();
function render(){let x=data[idx];title.textContent=x[0];q.textContent=x[1];qcn.textContent=x[2];why.textContent=x[3];logic.textContent=x[4];read.textContent=x[6];readcn.textContent=x[7];modelbox.innerHTML="<div class='en'>"+x[5]+"</div>";termsbox.innerHTML=x[8].map(t=>"<span class='term'>"+t+"</span>").join("");modelbox.classList.add("hidden");termsbox.classList.add("hidden");answer.value="";feedback.textContent="";status.textContent="";counter.textContent="第 "+(idx+1)+" / "+data.length+" 课";bar.style.width=(done.size/data.length*100)+"%";select.innerHTML=data.map((v,i)=>"<option value='"+i+"' "+(i==idx?"selected":"")+">"+(i+1)+". "+v[0]+"</option>").join("");chat.innerHTML="<div class='msg ai'>我是你的 IPO 教练。先学懂这道题，再练输出。</div>"}
function speak(){let u=new SpeechSynthesisUtterance(data[idx][6]);u.lang="en-US";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}
function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent="当前浏览器不支持语音识别，可以继续用文字输入。";return}let r=new SR();r.lang="en-US";status.textContent="🎙️ 正在听，请直接说英文……";r.start();r.onresult=e=>{answer.value=e.results[0][0].transcript;status.textContent="已识别，你可以修改后提交。"};r.onerror=()=>status.textContent="没有识别到清晰语音，请再试一次。"}
function model(){modelbox.classList.toggle("hidden");if(!modelbox.classList.contains("hidden"))speak()}function terms(){termsbox.classList.toggle("hidden")}
function hint(){feedback.innerHTML="<b>提示：</b>"+data[idx][4]+"<br>先用中文把几个要点说出来，再转成英文。"}
function submitA(){if(!answer.value.trim()){hint();return}done.add(idx);feedback.innerHTML="<b>教学反馈：</b>很好，你已经完成主动输出。现在再听一次标准答案，然后尝试换一种说法复述。";chat.innerHTML+="<div class='msg user'>"+answer.value.replace(/</g,"&lt;")+"</div><div class='msg ai'>完成第一轮输出。下一步：听标准答案 → 跟读 → 遮住答案 → 再说一遍。</div>";bar.style.width=(done.size/data.length*100)+"%"}
function coach(t){let m={explain:"核心不是背英文，而是先知道 Sponsor 想验证什么。",simple:"简单一点：先给结论，再给2-3个理由。",phrase:"把句子切成短块记：We are a biotechnology company / focusing on protein design / engineering and production.",repeat:"好，再来一次：先听 → 跟读 → 自己复述。"}[t];chat.innerHTML+="<div class='msg ai'>"+m+"</div>";if(t=="repeat")speak()}
function next(){done.add(idx);idx=Math.min(data.length-1,idx+1);render();scrollTo({top:0,behavior:"smooth"})}function prev(){idx=Math.max(0,idx-1);render();scrollTo({top:0,behavior:"smooth"})}
render();
</script></body></html>
